apiVersion: nais.io/v1alpha1
kind: Application
metadata:
  name: seb-fagprove-frontend-dev
  namespace: laerlinger
spec:
  ingresses:
    - https://seb-fagprove-frontend-dev.intern.dev.nav.no
  image: {{image}}
  port: 8080
  replicas:
    max: 1
    min: 1
  resources:
    requests:
      cpu: 50m
      memory: 32Mi
  env:
    - name: BACKEND_URL
      value: http://seb-fagprove-backend-dev
    - name: TZ
      value: Europe/Oslo
  accessPolicy:
    outbound:
      rules:
        - application: seb-fagprove-backend-dev
